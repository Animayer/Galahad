<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Galahad Discord emojis</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      background: #0b1220;
      color: #e8eefc;
      padding: 1.5rem;
    }
    h1 { font-size: 1.6rem; margin: 0 0 0.25rem; }
    .sub { opacity: 0.75; margin-bottom: 1.25rem; max-width: 46rem; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1rem;
    }
    figure {
      margin: 0;
      background: #121a2b;
      border: 1px solid #243049;
      border-radius: 10px;
      padding: 0.75rem;
      text-align: center;
    }
    .views {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 1rem;
      min-height: 128px;
    }
    img { image-rendering: pixelated; image-rendering: crisp-edges; }
    .chat { width: 48px; height: 48px; }
    .full { width: 128px; height: 128px; }
    figcaption { margin-top: 0.5rem; font-size: 0.85rem; }
    .sizes { font-size: 0.75rem; opacity: 0.7; margin-top: 0.2rem; }
    a { color: #8ec7ff; }
    code { font-size: 0.8rem; opacity: 0.85; }
  </style>
</head>
<body>
  <h1>Galahad · Discord emoji pack</h1>
  <p class="sub">
    36 static PNGs from Ryan’s emote sheet · 128×128 · nearest-neighbor ·
    <a href="README.md">upload notes</a> ·
    <a href="https://github.com/Animayer/Galahad/tree/main/assets/discord-emojis">GitHub folder</a> ·
    <a href="../../">Hold the Line</a>
  </p>
  <p class="sub">Left tile is Discord chat size (48px). Right tile is the upload canvas (128px). Right-click a 128px PNG to save.</p>
  <div class="grid" id="grid"></div>
  <script>
    const beats = [
      ["galahad_grin.png", "Grin", ":galahad_grin:"],
      ["galahad_rage.png", "Rage", ":galahad_rage:"],
      ["galahad_love.png", "Love", ":galahad_love:"],
      ["galahad_confused.png", "Confused", ":galahad_confused:"],
      ["galahad_shocked.png", "Shocked", ":galahad_shocked:"],
      ["galahad_scared.png", "Scared", ":galahad_scared:"],
      ["galahad_facepalm.png", "Facepalm", ":galahad_facepalm:"],
      ["galahad_praying.png", "Praying", ":galahad_praying:"],
      ["galahad_drunk.png", "Drunk", ":galahad_drunk:"],
      ["galahad_sick.png", "Sick", ":galahad_sick:"],
      ["galahad_sunglasses.png", "Sunglasses", ":galahad_sunglasses:"],
      ["galahad_smug.png", "Smug", ":galahad_smug:"],
      ["galahad_eating.png", "Eating", ":galahad_eating:"],
      ["galahad_drinking.png", "Drinking", ":galahad_drinking:"],
      ["galahad_singing.png", "Singing", ":galahad_singing:"],
      ["galahad_cheering.png", "Cheering", ":galahad_cheering:"],
      ["galahad_theatre_mask.png", "Theatre mask", ":galahad_theatre_mask:"],
      ["galahad_trapped.png", "Trapped", ":galahad_trapped:"],
      ["galahad_thumbs_up.png", "Thumbs up", ":galahad_thumbs_up:"],
      ["galahad_thumbs_down.png", "Thumbs down", ":galahad_thumbs_down:"],
      ["galahad_shrug.png", "Shrug", ":galahad_shrug:"],
      ["galahad_mini_horse.png", "Mini horse", ":galahad_mini_horse:"],
      ["galahad_melting.png", "Melting", ":galahad_melting:"],
      ["galahad_clown.png", "Clown", ":galahad_clown:"],
      ["galahad_robotic.png", "Robotic", ":galahad_robotic:"],
      ["galahad_possessed.png", "Possessed", ":galahad_possessed:"],
      ["galahad_ghostly.png", "Ghostly", ":galahad_ghostly:"],
      ["galahad_meditating.png", "Meditating", ":galahad_meditating:"],
      ["galahad_reading.png", "Reading", ":galahad_reading:"],
      ["galahad_birthday.png", "Birthday", ":galahad_birthday:"],
      ["galahad_time_travel.png", "Time travel", ":galahad_time_travel:"],
      ["galahad_teleport.png", "Teleport", ":galahad_teleport:"],
      ["galahad_pirate.png", "Pirate", ":galahad_pirate:"],
      ["galahad_flower.png", "Flower", ":galahad_flower:"],
      ["galahad_fishing.png", "Fishing", ":galahad_fishing:"],
      ["galahad_exploding.png", "Exploding", ":galahad_exploding:"],
    ];
    const grid = document.getElementById("grid");
    for (const [file, label, shortcode] of beats) {
      const fig = document.createElement("figure");
      fig.innerHTML = `
        <div class="views">
          <a href="${file}"><img class="chat" src="${file}" alt="${label} at 48px" width="48" height="48" /></a>
          <a href="${file}"><img class="full" src="${file}" alt="${label}" width="128" height="128" /></a>
        </div>
        <figcaption>${label}<br /><code>${shortcode}</code><br /><code>${file}</code></figcaption>
        <div class="sizes">48px chat · 128px upload</div>`;
      grid.appendChild(fig);
    }
  </script>
</body>
</html>
